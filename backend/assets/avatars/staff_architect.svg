<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Torso & Blazer / Jacket -->
  <path d="M 140 1000 C 150 780, 240 700, 400 700 C 560 700, 650 780, 660 1000 Z" fill="url(#jacketGrad)" stroke="#334155" stroke-width="4"/>
  
  <!-- Crewneck Undershirt -->
  <path d="M 330 700 C 330 770, 470 770, 470 700 Z" fill="#020617"/>
  <!-- Subtle Emerald Tech Badge on Chest -->
  <circle cx="280" cy="800" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <circle cx="280" cy="800" r="5" fill="#10B981"/>

  <!-- Neck -->
  <path d="M 345 690 L 345 590 L 455 590 L 455 690 Z" fill="#334155"/>

  <!-- Head Base -->
  <path d="M 310 440 C 310 570, 340 610, 400 610 C 460 610, 490 570, 490 440 C 490 350, 460 330, 400 330 C 340 330, 310 350, 310 440 Z" fill="#1E293B" stroke="#475569" stroke-width="3"/>

  <!-- Hair Cut / Silhouette -->
  <path d="M 295 410 C 300 310, 350 280, 400 280 C 460 280, 505 310, 505 410 C 490 350, 460 330, 400 330 C 340 330, 310 350, 295 410 Z" fill="#0F172A"/>

  <!-- Modern Rectangular Tech Glasses -->
  <g filter="url(#emeraldGlow)">
    <!-- Left Rim -->
    <rect x="330" y="430" width="55" height="35" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
    <!-- Right Rim -->
    <rect x="415" y="430" width="55" height="35" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
    <!-- Bridge -->
    <line x1="385" y1="445" x2="415" y2="445" stroke="#10B981" stroke-width="3"/>
    <!-- Glass Reflections -->
    <line x1="335" y1="455" x2="355" y2="435" stroke="#E2E8F0" stroke-width="2" opacity="0.7"/>
    <line x1="420" y1="455" x2="440" y2="435" stroke="#E2E8F0" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Coffee Mug Held in Right Foreground -->
  <g transform="translate(480, 750)">
    <!-- Mug Body -->
    <rect x="0" y="0" width="100" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <!-- Mug Handle -->
    <path d="M 100 25 C 130 25, 130 95, 100 95" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <!-- Emerald Terminal Prompt on Mug '>_' -->
    <text x="25" y="65" font-family="monospace" font-size="28" font-weight="bold" fill="#10B981">&gt;_</text>
    <!-- Steaming Coffee Vapor -->
    <path d="M 30 -10 C 20 -30, 40 -40, 30 -60" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <path d="M 65 -10 C 55 -30, 75 -40, 65 -60" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>